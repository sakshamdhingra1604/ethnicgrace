backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Panipat Ethnic Wear Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Designer Suits", "Anarkali Sets", "Festive Kurtis", "Silk Sarees", "Bridal Lehengas"] }
      - { label: "Original Price (MRP)", name: "originalPrice", widget: "number" }
      - { label: "Opening Sale Price (10% OFF)", name: "salePrice", widget: "number" }
      - { label: "Badge / Tag", name: "badge", widget: "string", required: false }
      - { label: "Fabric Details", name: "fabric", widget: "string" }
      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Available Sizes", name: "sizes", widget: "list", default: ["S", "M", "L", "XL"] }
      - { label: "In Stock", name: "inStock", widget: "boolean", default: true }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  - name: "settings"
    label: "Panipat Store Settings"
    files:
      - file: "content/settings.json"
        label: "Store Configuration"
        name: "settings"
        fields:
          - { label: "Store Name", name: "storeName", widget: "string", default: "Ethnic Grace" }
          - { label: "WhatsApp Number", name: "phone", widget: "string", default: "919518285233" }
          - { label: "Announcement Bar", name: "announcement", widget: "string", default: "🎉 GRAND OPENING: Flat 10% OFF on All New Arrivals | 📍 Visit our Boutique in Panipat | Worldwide Shipping 📦" }
          - { label: "Currency", name: "currency", widget: "string", default: "₹" }
          - { label: "Address", name: "address", widget: "string", default: "Plot no. 99, Uttam Nagar, Devi Mandir Main Road, Panipat - 132103" }
